name: Publish next Facebook video

on:
  workflow_dispatch:
  schedule:
    # Jordan (UTC+3): 18:00, 22:00, 3:00
    - cron: '0 15 * * *'
    - cron: '0 19 * * *'
    - cron: '0 0 * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: facebook-auto-publisher
  cancel-in-progress: false

jobs:
  publish:
    # Scheduled runs stay disabled until repository variable AUTO_PUBLISH_ENABLED=true.
    # Manual workflow_dispatch runs are always allowed for testing.
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/280305406003/locations/global/workloadIdentityPools/github-actions/providers/github'
          service_account: 'facebook-publisher@facebook-publisher-506301.iam.gserviceaccount.com'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          

      - name: Cache caption model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: smolvlm2-500m-video-caption-v1

      - name: Install system video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Node dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install AI caption dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          python -m pip install transformers==4.55.3 accelerate==1.10.0 pillow==11.3.0

      - name: Publish next video
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          FACEBOOK_STORAGE_STATE_B64: ${{ secrets.FACEBOOK_STORAGE_STATE_B64 }}
          CAPTION_MODEL: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
        run: npm run publish

      - name: Save publisher state
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state.json
          git commit -m "Update published video state"
          git push
